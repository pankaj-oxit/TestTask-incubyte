<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="620" fill="#f8f9fa" rx="8"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">ACME Salary Management — System Architecture</text>
  <!-- Frontend -->
  <rect x="50" y="55" width="700" height="110" rx="8" fill="#e8f4fd" stroke="#2196F3" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Browser — Frontend</text>
  <rect x="80" y="88" width="180" height="60" rx="6" fill="#2196F3" opacity="0.15" stroke="#2196F3" stroke-width="1"/>
  <text x="170" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">React + TypeScript</text>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#1565C0">Vite · MUI</text>
  <rect x="310" y="88" width="180" height="60" rx="6" fill="#2196F3" opacity="0.15" stroke="#2196F3" stroke-width="1"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">TanStack Query</text>
  <text x="400" y="130" text-anchor="middle" font-size="11" fill="#1565C0">Caching · Loading states</text>
  <rect x="540" y="88" width="180" height="60" rx="6" fill="#2196F3" opacity="0.15" stroke="#2196F3" stroke-width="1"/>
  <text x="630" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Recharts</text>
  <text x="630" y="130" text-anchor="middle" font-size="11" fill="#1565C0">Bar charts · Histogram</text>
  <!-- Arrow Frontend to Backend -->
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
  <line x1="400" y1="165" x2="400" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="190" font-size="11" fill="#555">HTTPS / REST</text>
  <!-- Backend -->
  <rect x="50" y="210" width="700" height="230" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">FastAPI Backend (Python 3.11+)</text>
  <rect x="80" y="242" width="190" height="55" rx="6" fill="#4CAF50" opacity="0.2" stroke="#4CAF50" stroke-width="1"/>
  <text x="175" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Routes</text>
  <text x="175" y="280" text-anchor="middle" font-size="10" fill="#1B5E20">HTTP in/out · Pydantic schemas</text>
  <text x="175" y="293" text-anchor="middle" font-size="10" fill="#1B5E20">employees · insights · meta</text>
  <line x1="270" y1="269" x2="310" y2="269" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="242" width="180" height="55" rx="6" fill="#4CAF50" opacity="0.2" stroke="#4CAF50" stroke-width="1"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Services</text>
  <text x="400" y="280" text-anchor="middle" font-size="10" fill="#1B5E20">Business rules · Validation</text>
  <text x="400" y="293" text-anchor="middle" font-size="10" fill="#1B5E20">Currency · Stats</text>
  <line x1="490" y1="269" x2="530" y2="269" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="242" width="190" height="55" rx="6" fill="#4CAF50" opacity="0.2" stroke="#4CAF50" stroke-width="1"/>
  <text x="625" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Repositories</text>
  <text x="625" y="280" text-anchor="middle" font-size="10" fill="#1B5E20">DB queries only</text>
  <text x="625" y="293" text-anchor="middle" font-size="10" fill="#1B5E20">employee_repo · insights_repo</text>
  <rect x="80" y="315" width="640" height="35" rx="5" fill="#4CAF50" opacity="0.15" stroke="#4CAF50" stroke-width="1"/>
  <text x="400" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">SQLAlchemy 2.x ORM · Pydantic v2 · Alembic Migrations</text>
  <text x="400" y="342" text-anchor="middle" font-size="10" fill="#1B5E20">Models: Employee · CurrencyRate</text>
  <rect x="80" y="360" width="300" height="65" rx="5" fill="#fff9c4" stroke="#F9A825" stroke-width="1"/>
  <text x="230" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">core/stats.py</text>
  <text x="230" y="394" text-anchor="middle" font-size="10" fill="#F57F17">median · percentile · distribution buckets</text>
  <text x="230" y="408" text-anchor="middle" font-size="10" fill="#F57F17">Pure functions — no DB dependency</text>
  <rect x="400" y="360" width="320" height="65" rx="5" fill="#fff9c4" stroke="#F9A825" stroke-width="1"/>
  <text x="560" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">currency_service.py</text>
  <text x="560" y="394" text-anchor="middle" font-size="10" fill="#F57F17">COUNTRY_CURRENCY_MAP</text>
  <text x="560" y="408" text-anchor="middle" font-size="10" fill="#F57F17">local → USD conversion (fixed rates)</text>
  <!-- Arrow Backend to DB -->
  <line x1="400" y1="440" x2="400" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="465" font-size="11" fill="#555">psycopg2</text>
  <!-- Database -->
  <rect x="50" y="485" width="700" height="115" rx="8" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="400" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">PostgreSQL Database</text>
  <rect x="80" y="518" width="290" height="65" rx="6" fill="#E91E63" opacity="0.12" stroke="#E91E63" stroke-width="1"/>
  <text x="225" y="537" text-anchor="middle" font-size="11" font-weight="bold" fill="#880E4F">employees</text>
  <text x="225" y="552" text-anchor="middle" font-size="10" fill="#880E4F">id · employee_code · name · email</text>
  <text x="225" y="566" text-anchor="middle" font-size="10" fill="#880E4F">job_title · department · country_code</text>
  <text x="225" y="580" text-anchor="middle" font-size="10" fill="#880E4F">currency · annual_salary · hire_date</text>
  <rect x="430" y="518" width="290" height="65" rx="6" fill="#E91E63" opacity="0.12" stroke="#E91E63" stroke-width="1"/>
  <text x="575" y="537" text-anchor="middle" font-size="11" font-weight="bold" fill="#880E4F">currency_rates</text>
  <text x="575" y="552" text-anchor="middle" font-size="10" fill="#880E4F">currency (PK) · rate_to_usd</text>
  <text x="575" y="566" text-anchor="middle" font-size="10" fill="#880E4F">Fixed rates as of 2024-01-01</text>
  <text x="575" y="580" text-anchor="middle" font-size="10" fill="#880E4F">10 currencies · USD base</text>
</svg>
